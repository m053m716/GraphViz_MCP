[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graphviz-mcp"
version = "0.2.1"
description = "Local stdio MCP server for safe GraphViz rendering and Markdown publishing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
graphviz-mcp = "server:main"
graphviz-mcp-vscode = "graphviz_mcp_setup:vscode_main"
graphviz-mcp-install = "graphviz_mcp_setup:install_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
py-modules = ["server", "graphviz_mcp_setup"]
