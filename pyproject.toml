[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "graphviz-mcp"
version = "1.0.0"
description = "Local stdio MCP server for safe GraphViz rendering and Markdown publishing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29.0,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
graphviz-mcp = "server:main"
graphviz-mcp-vscode = "graphviz_mcp_setup:vscode_main"
graphviz-mcp-install = "graphviz_mcp_setup:install_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
py-modules = ["server", "graphviz_mcp_setup"]

[tool.setuptools.data-files]
"share/graphviz-mcp/skill" = ["skills/graphviz-mcp/SKILL.md"]
"share/graphviz-mcp/skill/agents" = ["skills/graphviz-mcp/agents/openai.yaml"]
"share/graphviz-mcp/skill/assets" = ["skills/graphviz-mcp/assets/graphviz-mcp.png"]
"share/graphviz-mcp/agent-skills/muse" = [".agents/skills/graphviz-mcp/SKILL.md"]
"share/graphviz-mcp/agent-skills/claude" = [".claude/skills/graphviz-mcp/SKILL.md"]
